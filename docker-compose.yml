
services:
  # PostgreSQL with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema/DB_SCHEMA_pgvector.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama LLM service
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Model downloader service
  model-downloader:
    image: ubuntu:22.04
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - LLM_MODEL=${LLM_MODEL}
    command: >
      bash -c "
        apt-get update -qq &&
        apt-get install -y -qq curl &&
        sleep 10 &&
        MODEL_NAME=$${LLM_MODEL#ollama:} &&
        echo 'Downloading model: '$$MODEL_NAME &&
        curl -X POST http://ollama:11434/api/pull -d '{\"model\": \"'$$MODEL_NAME'\"}' &&
        echo 'Model download initiated successfully'
      "
    restart: "no"

  # FastAPI application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}
      - LLM_MODEL=${LLM_MODEL}
      - GPU_LAYERS=${GPU_LAYERS}
      - EMBED_MODEL=${EMBED_MODEL}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./samples:/app/samples:ro
    restart: unless-stopped

volumes:
  pgdata:
  ollama_models: